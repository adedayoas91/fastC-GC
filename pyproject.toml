[project]
name = "fastcgc"
version = "0.1.0"
description = "Vectorized fastC-GC and fastC-GC* estimators"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "tqdm>=4.68.3",
]

[project.optional-dependencies]
comparison = [
    "causalchamber==0.2.8",
    "tigramite==5.2.10.1",
]
conventional-cgc = [
    "cdt==0.6.0",
    "gc-extension @ git+https://github.com/adedayoas91/causalized-GC.git@575ac1dc67a0282a5ca88bc11a2804df052f674d",
    "numba==0.68.0",
    "torch==2.14.1",
]
dev = [
    "pytest>=8.4",
]
notebooks = [
    "ipykernel==7.4.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fastCGC*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
